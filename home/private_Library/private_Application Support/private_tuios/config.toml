# TUIOS: sessions, workspaces, splits, persistence and the agents.
#
# Ghostty only draws it (~/.config/ghostty), OmniWM places the window
# (~/.config/omniwm). Managed by chezmoi.
#
# Saving applies it at once (or prefix r). Every option: `tuios config browse`.
# Every key: `tuios keybinds list`, `tuios keybinds cheatsheet`; clashes:
# `tuios keybinds doctor`.

[startup]
tiled = true
# Sessions live in a daemon: close Ghostty and the agents keep working,
# reopen and you are back where you were (herdr's server, same idea).
daemon = true

[agents]
enabled = true

# The daemon runs these with nobody attached: agents.sh, next to this file, tells
# OmniWM's bar at once when an agent finishes or waits for you, and when you
# settle it.
[hooks]
after-agent-state = ['"$HOME/Library/Application Support/tuios/agents.sh"']
after-settle = ['"$HOME/Library/Application Support/tuios/agents.sh"']

# The dock's default right side, with the agents' poll and caffeinate before the clock.
[dock]
right = ["notifications", "copy-help", "custom/agents", "custom/caffeinate", "cpu", "ram", "clock", "session-controls"]

# The agents live in OmniWM's bar: this cell prints nothing and only polls
# agents.sh, which catches what the hooks miss (an agent closed with its pane).
[dock.custom.agents]
refresh = "10s"
command = '"$HOME/Library/Application Support/tuios/agents.sh"'

# caffeinate.sh, next to this file: a coffee cup, full while the Mac stays awake
# with the display off; a click starts or stops caffeinate.
[dock.custom.caffeinate]
refresh = "5s"
command = '"$HOME/Library/Application Support/tuios/caffeinate.sh"'
on-click = '"$HOME/Library/Application Support/tuios/caffeinate.sh" toggle'

[appearance]
# No theme: TUIOS paints with Ghostty's palette (Modest Dark), so the colors
# change in one place only.
theme = ""
glyphs = "heavy"
border_style = "glyphs"
frame_panels = true
window_title_position = "top"
window_title_style = "plain"
motion = "full"
session_border = false
zen_mode = "disabled"
panel_padding = 2
tiling_scheme = "spiral"
border_gradient_angle = 45
pane_overlays = true
# The borders as OmniWM draws its own: the focused pane from blue to purple, the
# others in the palette's border grey. Slot names, not hex, so they follow
# Ghostty's palette; dialogs (pane_overlays) take the focused pane's border.
border_focused_gradient = "blue purple"
border_unfocused_color = "black"
# The pane you are in stands out: the others fade, and so does what is behind a
# popup (lazygit, yazi, projects).
dim_unfocused = 20
popup_dim = 30
# The dock at the bottom, as tmux's status line: the top already holds the menu
# bar and OmniWM's bar. One row, no rule.
dockbar_position = "bottom"
dock_compact = true
window_button_position = "left"
window_button_style = "dots"
drop_preview = "outline"
gap = 2
window_title_align = "auto"

[keybindings]
leader_key = ""
# Prefix Ctrl+B with tmux's keys after it. Ghostty also sends it on
# Shift+Space (~/.config/ghostty/tuios-keys).
preset = "tmux"

[keybindings.global]
# Ctrl+P is "previous" for the shell, nvim and fzf: the palette stays on
# prefix : / P / Ctrl+P.
command_palette = []
# Alt is OmniWM's: the launcher stays on prefix a.
launcher = []

# Alt belongs to OmniWM (focus, workspaces) and to the shell (word jumps);
# alt+m (music, at the end) is TUIOS's.
# TUIOS gets the same moves through the prefix: h j k l focus a pane, 1-9 pick
# a workspace, w ! move a pane, ( ) step sessions.
[keybindings.terminal_mode]
terminal_focus_left = []
terminal_focus_right = []
terminal_focus_up = []
terminal_focus_down = []
terminal_next_window = []
terminal_prev_window = []
terminal_exit_mode = []

[keybindings.window_management]
next_session = []
prev_session = []

[keybindings.workspaces]
switch_workspace_1 = []
switch_workspace_2 = []
switch_workspace_3 = []
switch_workspace_4 = []
switch_workspace_5 = []
switch_workspace_6 = []
switch_workspace_7 = []
switch_workspace_8 = []
switch_workspace_9 = []
move_and_follow_1 = []
move_and_follow_2 = []
move_and_follow_3 = []
move_and_follow_4 = []
move_and_follow_5 = []
move_and_follow_6 = []
move_and_follow_7 = []
move_and_follow_8 = []
move_and_follow_9 = []
send_to_workspace_1 = []
send_to_workspace_2 = []
send_to_workspace_3 = []
send_to_workspace_4 = []
send_to_workspace_5 = []
send_to_workspace_6 = []
send_to_workspace_7 = []
send_to_workspace_8 = []
send_to_workspace_9 = []

# Shift is for typing (Shift+Space, then a capital, is text), so the
# Shift+letter actions used most also sit on Ctrl+letter, as in herdr.
[keybindings.prefix_mode]
new_worktree = ["U", "ctrl+g"]
prefix_command_palette = [":", "P", "ctrl+p"]
prefix_close_session = ["X", "ctrl+x"]
prefix_next_finished = ["O", "ctrl+o"]
# OmniWM's letters, with the prefix instead of alt: h j k l focus a pane (the
# arrows too), f zooms it, tab goes back to the last workspace. o finds a pane in
# every session; h j k l move between panes, so o no longer needs to.
terminal_focus_left = ["left", "h"]
terminal_focus_down = ["down", "j"]
terminal_focus_up = ["up", "k"]
terminal_focus_right = ["right", "l"]
prefix_fullscreen = ["z", "f"]
last_workspace = ["tab"]
choose_tree = ["o", "/"]
prefix_next_window = []
prefix_jump_notif = []
prefix_keybinds = []

# ── Popups: a floating pane that closes when the program exits ─────────────
# Same letters as the herdr popups, with Ctrl.

[[keybindings.command]]
key = "prefix+ctrl+f"
type = "popup"
description = "Projects: open a repo as a session"
command = '''dir=$(find "$HOME/Developer" "$HOME/Dev-Env/git-repositories" -mindepth 2 -maxdepth 6 \( -name node_modules -o -name vendor -o -name .terraform \) -prune -o -name .git -print 2>/dev/null | sed 's|/\.git$||' | sort | fzf --prompt='project> ' --layout=reverse) && tuios switch-session --create --cwd "$dir" "$(basename "$dir")"'''

[[keybindings.command]]
key = "prefix+ctrl+l"
type = "popup"
description = "lazygit"
command = "lazygit"

[[keybindings.command]]
key = "prefix+ctrl+y"
type = "popup"
description = "yazi, files open in nvim"
command = "EDITOR=nvim yazi"

[[keybindings.command]]
key = "prefix+ctrl+s"
type = "popup"
description = "btop: CPU, RAM, disk, processes"
command = "btop"

[[keybindings.command]]
key = "prefix+ctrl+d"
type = "popup"
description = "lazydocker"
command = "lazydocker"

# ── Worktrees: herdr's keys ──────────────────────────────────────────────────
# Each worktree is a session: prefix ctrl+g makes one (new_worktree above),
# prefix ctrl+a removes the session's worktree after asking. Uncommitted work
# makes it refuse, and the branch stays.
[[keybindings.command]]
key = "prefix+ctrl+a"
type = "popup"
description = "Remove this session's worktree"
command = '''
printf '\n  remove the worktree of %s and close the session? [y/N] ' "$TUIOS_SESSION"
read -r answer && [ "$answer" = y ] || exit 0
tuios worktree rm "$TUIOS_SESSION" >/dev/null || { printf '\n  press enter to close '; read -r _; }'''

# ── Music ────────────────────────────────────────────────────────────────────
# spotatui in a session of its own, "music", made the first time: one session,
# so one spotatui whichever session you come from. From music, back to the
# session before it. A new session opens with a shell: it holds the session
# until spotatui's pane takes its place. Quitting spotatui closes the pane; the
# next alt+m opens it again.
[[keybindings.command]]
key = "alt+m"
type = "shell"
description = "spotatui, in the music session, or back"
command = '''
if [ "$TUIOS_SESSION" = music ]; then exec tuios run-command -s music last_session; fi
tuios list-windows -s music >/dev/null 2>&1 ||
  { tuios new -d music --cwd "$HOME" && tuios set-window -s music --name init; } >/dev/null
tuios get-window -s music spotify >/dev/null 2>&1 || {
  tuios new-window -s music spotify -- /opt/homebrew/bin/spotatui
  tuios close-window init -s music
} >/dev/null 2>&1
tuios switch-session -s "$TUIOS_SESSION" music >/dev/null'''

[screensaver]
enabled = true
effect = "errorcorrect"
while_busy = true
idle_minutes = 10

[spotlight]
follow = "cursor"

[appearance.scrollbar]
style = "track"

# The rail's sections with their Nerd Font icons, as eza and yazi draw files.
[appearance.sidebar]
header_style = "icon"

# Copy mode in Ghostty's colors (themes/modest-dark): its selection and cursor,
# the matches in the palette's yellow. TUIOS's defaults come from another theme.
[appearance.selection]
bg = "#2c313a"
fg = "#d7dae0"
cursor_bg = "#5ab0f6"
cursor_fg = "#0f1219"
match_bg = "#ebc275"
match_fg = "#0f1219"
search_bg = "#3f4451"
search_fg = "#ebc275"

[notifications]
bell = "toast"
