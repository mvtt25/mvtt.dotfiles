# btop: the TUIOS popup on prefix ctrl+s. Managed by chezmoi: only what differs
# from `btop --default-config`. btop never rewrites this file, so an option
# changed in btop's menu lasts until it quits: change it here.
save_config_on_exit = false

# Modest Dark (themes/modest-dark.theme) over Ghostty's own background.
color_theme = "modest-dark"
theme_background = false

vim_keys = true
cpu_bottom = true
mem_below_net = true
